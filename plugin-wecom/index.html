<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>文档讨论</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: flex; flex-direction: column;
      font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px;
      background: #fff; color: #333;
    }
    body.dark { background: #2d2f31 !important; color: #e8eaed !important; }

    #head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; border-bottom: 1px solid #e5e7eb; flex: none;
    }
    body.dark #head { border-bottom-color: #40444b; }
    #head .t { font-weight: 600; }
    #who { color: #8a8f98; font-size: 12px; display: flex; align-items: center; gap: 6px; max-width: 60%; }
    #whoName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #logoutBtn {
      border: 0; background: transparent; color: #8a8f98; font-size: 12px;
      cursor: pointer; padding: 2px 4px; flex: none;
    }
    #logoutBtn:hover { color: #e05555; }

    #msgs { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 82%; display: flex; flex-direction: column; gap: 2px; }
    .msg .meta { font-size: 11px; color: #8a8f98; }
    .msg .meta b { font-weight: 600; color: #555; }
    body.dark .msg .meta b { color: #c3c7cc; }
    .msg .bubble {
      padding: 6px 10px; border-radius: 8px; line-height: 1.5;
      background: #f1f3f5; word-break: break-word; white-space: pre-wrap;
      align-self: flex-start;
    }
    body.dark .msg .bubble { background: #3a3e44; }
    .msg.self { align-self: flex-end; align-items: flex-end; }
    .msg.self .bubble { background: #4A8DFF; color: #fff; }
    .msg.self .meta b { color: #4A8DFF; }
    #empty { color: #8a8f98; font-size: 12px; text-align: center; margin-top: 24px; }

    #authbar {
      display: none; align-items: center; justify-content: center; gap: 10px;
      padding: 8px 12px; background: #fff8e6; border-top: 1px solid #f0e6c8;
      color: #8a6d1a; font-size: 12px; flex: none;
    }
    body.dark #authbar { background: #3d3823; border-top-color: #565040; color: #d9c27a; }
    #authbar.show { display: flex; }
    #authbar button {
      border: 0; border-radius: 5px; background: #07C160; color: #fff;
      padding: 5px 14px; font-size: 12px; cursor: pointer; flex: none;
    }
    #authbar button:hover { background: #06ad56; }
    #authbar button:disabled { opacity: .55; cursor: default; }

    #composer {
      display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid #e5e7eb; flex: none;
    }
    body.dark #composer { border-top-color: #40444b; }
    #input {
      flex: 1; border: 1px solid #d5d9de; border-radius: 6px; padding: 6px 10px;
      font-size: 13px; font-family: inherit; background: #fff; color: inherit; outline: none;
    }
    #input:focus { border-color: #4A8DFF; }
    #input:disabled { background: #f3f4f6; cursor: not-allowed; }
    body.dark #input { background: #26282b; border-color: #4b4f56; }
    body.dark #input:disabled { background: #33363a; }
    #send {
      border: 0; border-radius: 6px; background: #4A8DFF; color: #fff;
      padding: 6px 16px; font-size: 13px; cursor: pointer; flex: none;
    }
    #send:hover { background: #3579ec; }
    #send:disabled { opacity: .5; cursor: default; }
  </style>
  <!-- OnlyOffice 插件 SDK：用编辑器同源的本地路径，不依赖外网 -->
  <script src="/sdkjs-plugins/v1/plugins.js"></script>
  <!-- 共享企微登录助手（plugin-wecom 目录维护，面板与登录流程共用） -->
  <script src="config.js"></script>
  <script src="auth.js"></script>
</head>
<body>
  <div id="head">
    <span class="t">文档讨论</span>
    <span id="who"><span id="whoName"></span><button id="logoutBtn" style="display:none" title="退出登录">退出</button></span>
  </div>
  <div id="msgs"><div id="empty">还没有消息，登录后开始讨论</div></div>
  <div id="authbar"><span id="authTip"></span><button id="loginBtn">企微登录</button></div>
  <div id="composer">
    <input id="input" type="text" placeholder="输入消息…" maxlength="2000" disabled>
    <button id="send" disabled>发送</button>
  </div>
  <script src="plugin.js?v=2"></script>
</body>
</html>
